<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Agent Itachi | Master AI Video Generator Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030712; color: #f3f4f6; }
    .font-mono-code { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen flex flex-col p-3 md:p-6 pb-28 select-none">

  <!-- Header -->
  <header class="w-full max-w-5xl mx-auto bg-slate-900/90 border border-slate-800 rounded-2xl p-4 mb-4 flex justify-between items-center shadow-2xl">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-red-600 to-amber-600 flex items-center justify-center font-black text-white text-lg">I</div>
      <div>
        <h1 class="text-base font-black text-white">AGENT 5: "ITACHI"</h1>
        <p class="text-[11px] text-slate-400 font-mono-code">Generative AI Video Engine • Zero Watermark</p>
      </div>
    </div>
    <div class="flex gap-2">
      <button onclick="openHfModal()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-xl border border-slate-700 text-amber-300 font-bold">
        <i class="fa-solid fa-key"></i> <span id="hfKeyLabel">Set HF Key</span>
      </button>
      <a href="index.html" class="text-xs bg-amber-500 text-slate-950 font-extrabold px-3 py-2 rounded-xl">👑 Erwin</a>
    </div>
  </header>

  <!-- Cockpit -->
  <main class="w-full max-w-5xl mx-auto space-y-4">
    <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4 md:p-6 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <span class="text-xs font-bold text-red-400 font-mono-code">AI Video Synthesis</span>
        <button onclick="autoImportScript()" class="text-xs bg-purple-500/10 text-purple-300 border border-purple-500/30 px-3 py-1.5 rounded-xl font-bold">
          Auto-Import Script
        </button>
      </div>

      <textarea id="promptInput" rows="3" placeholder="Video prompt likhein..." class="w-full bg-slate-950 border border-slate-800 focus:border-red-400 rounded-xl p-3 text-xs text-slate-200 outline-none font-mono-code"></textarea>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs text-slate-300 font-semibold">Aspect Ratio</label>
          <select id="ratioSelect" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-amber-300 outline-none font-mono-code">
            <option value="9:16">Vertical 9:16 (Shorts/Reels)</option>
            <option value="16:9">Horizontal 16:9 (YouTube)</option>
          </select>
        </div>
        <div>
          <label class="text-xs text-slate-300 font-semibold">Model Engine</label>
          <select id="engineSelect" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white outline-none">
            <option value="black-forest-labs/FLUX.1-schnell">FLUX Schnell (Ultra-Fast 4K)</option>
            <option value="stabilityai/stable-diffusion-xl-base-1.0">SDXL Photorealistic</option>
          </select>
        </div>
      </div>

      <button id="genBtn" onclick="generateRealVisualVideo()" class="w-full bg-gradient-to-r from-red-600 to-amber-600 hover:from-red-500 text-white font-black py-3.5 rounded-xl text-sm transition shadow-xl">
        <i class="fa-solid fa-film"></i> Render Master Video Asset
      </button>
    </div>

    <!-- Live Telemetry -->
    <div id="telemetryBox" class="hidden bg-slate-900 border border-red-500/30 rounded-2xl p-4 space-y-2">
      <div class="flex justify-between items-center text-xs font-mono-code text-red-400">
        <span id="telemetryStatus"><i class="fa-solid fa-spinner fa-spin"></i> Synthesizing Neural Frames...</span>
        <span id="telemetryPct">65%</span>
      </div>
      <div class="w-full bg-slate-950 h-2 rounded-full overflow-hidden border border-slate-800">
        <div id="telemetryBar" class="bg-gradient-to-r from-red-600 to-amber-500 h-full w-[65%]"></div>
      </div>
    </div>

    <!-- Output Player Area -->
    <div id="outputArea" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-4 md:p-6 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <span class="text-xs font-bold text-red-400 font-mono-code">Master Output Render</span>
        <a id="downloadBtn" download="itachi_render.png" class="text-xs bg-slate-800 px-3 py-1.5 rounded-xl text-slate-200 border border-slate-700">Download Asset</a>
      </div>

      <div class="bg-slate-950 rounded-xl overflow-hidden border border-slate-800 flex justify-center p-2">
        <img id="renderResultImg" class="max-h-[480px] rounded-lg object-contain" src="">
      </div>
    </div>
  </main>

  <!-- HF Modal -->
  <div id="hfModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl p-5 w-full max-w-sm space-y-4">
      <h3 class="text-sm font-bold text-amber-400">Set Hugging Face Key</h3>
      <input id="hfKeyInput" type="password" placeholder="hf_..." class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs text-white outline-none font-mono-code">
      <div class="flex justify-end gap-2">
        <button onclick="closeHfModal()" class="text-xs px-3 py-2 bg-slate-800 text-slate-300 rounded-xl">Cancel</button>
        <button onclick="saveHfKey()" class="text-xs px-4 py-2 bg-amber-500 text-slate-950 font-bold rounded-xl">Save</button>
      </div>
    </div>
  </div>

  <script>
    let hfKey = localStorage.getItem('HF_API_KEY') || '';

    function checkKey() {
      const lbl = document.getElementById('hfKeyLabel');
      if (hfKey) { lbl.innerText = "HF Key Set ✓"; lbl.className = "text-emerald-400 font-bold"; }
      else { lbl.innerText = "Set HF Key"; lbl.className = "text-amber-300"; }
    }

    function openHfModal() { document.getElementById('hfKeyInput').value = hfKey; document.getElementById('hfModal').classList.remove('hidden'); }
    function closeHfModal() { document.getElementById('hfModal').classList.add('hidden'); }
    function saveHfKey() {
      const v = document.getElementById('hfKeyInput').value.trim();
      if (!v) return alert("Key required!");
      hfKey = v;
      localStorage.setItem('HF_API_KEY', hfKey);
      checkKey(); closeHfModal();
      alert("✅ Hugging Face Key Saved!");
    }

    function autoImportScript() {
      const stored = localStorage.getItem('PIPELINE_SCRIPT_CH_02_MYSTERY');
      if (stored) {
        try {
          const d = JSON.parse(stored);
          document.getElementById('promptInput').value = d.scenes?.[0]?.visual_directive || "Cinematic 8k mystery scene, volumetric lighting, photorealistic";
        } catch (e) {}
      } else {
        document.getElementById('promptInput').value = "Ultra-detailed aerial view of dark Antarctica ice shelf with glowing cyan crevice, 8k cinematic octane render, 35mm lens, photorealistic";
      }
    }

    async function generateRealVisualVideo() {
      if (!hfKey) { openHfModal(); return; }
      const prompt = document.getElementById('promptInput').value.trim();
      const model = document.getElementById('engineSelect').value;
      if (!prompt) return alert("Prompt dalein!");

      const btn = document.getElementById('genBtn');
      const telem = document.getElementById('telemetryBox');
      const out = document.getElementById('outputArea');
      const img = document.getElementById('renderResultImg');
      const dl = document.getElementById('downloadBtn');

      btn.disabled = true;
      telem.classList.remove('hidden');
      out.classList.add('hidden');

      try {
        const res = await fetch(`https://api-inference.huggingface.co/models/${model}`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${hfKey}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ inputs: prompt })
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}: Model loading ya invalid key. 20s baad try karein.`);

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        img.src = url;
        dl.href = url;
        out.classList.remove('hidden');
      } catch (err) {
        alert("Render Error: " + err.message);
      } finally {
        btn.disabled = false;
        telem.classList.add('hidden');
      }
    }

    window.onload = () => { checkKey(); autoImportScript(); };
  </script>
</body>
</html>
