<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Agent Itachi | Master AI Visual & Video Studio Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030712; color: #f3f4f6; }
    .font-mono-code { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen flex flex-col p-3 md:p-6 pb-28 select-none">

  <!-- Header Console -->
  <header class="w-full max-w-6xl mx-auto bg-slate-900/90 border border-slate-800 rounded-2xl p-4 mb-4 flex justify-between items-center shadow-2xl backdrop-blur">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-red-600 via-rose-600 to-amber-600 flex items-center justify-center font-black text-white text-xl shadow-lg ring-1 ring-red-500/50">
        I
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-base md:text-lg font-black tracking-wide text-white">AGENT 5: "ITACHI"</h1>
          <span class="text-[9px] px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 font-bold uppercase font-mono-code">
            App Bridge Connected v12.0
          </span>
        </div>
        <p class="text-[11px] text-slate-400 font-mono-code">Local Python Bridge Active • Direct MP4 Compiler • Levi Ready</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <a href="index.html" class="text-xs bg-amber-500 hover:bg-amber-400 active:scale-95 text-slate-950 font-extrabold px-3 py-2 rounded-xl shadow transition flex items-center gap-1.5">
        <i class="fa-solid fa-crown"></i> Erwin Studio
      </a>
    </div>
  </header>

  <!-- Cockpit -->
  <main class="w-full max-w-6xl mx-auto space-y-4">

    <!-- Control Studio -->
    <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4 md:p-6 shadow-xl space-y-4">
      
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b border-slate-800 pb-3">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-bridge text-red-500"></i>
          <span class="text-xs font-bold text-red-400 uppercase tracking-wider font-mono-code">
            Termux Local Bridge Video Synthesizer
          </span>
        </div>
        <div class="flex flex-wrap gap-2">
          <button onclick="autoImportScript()" class="text-xs bg-purple-500/10 hover:bg-purple-500/20 text-purple-300 border border-purple-500/30 px-3 py-1.5 rounded-xl font-mono-code font-bold flex items-center gap-1.5 transition">
            <i class="fa-solid fa-bolt"></i> Auto-Import Script
          </button>
        </div>
      </div>

      <!-- Prompt Input -->
      <div class="space-y-1">
        <label class="text-xs font-semibold text-slate-300">Scene Directives / Bridge Prompt</label>
        <textarea id="promptInput" rows="3" placeholder="Enter video prompt to send to Termux worker..." class="w-full bg-slate-950 border border-slate-800 focus:border-red-400 rounded-xl p-3 text-xs text-slate-200 outline-none font-mono-code leading-relaxed">3D black tactical jacket macro cinematic push in</textarea>
      </div>

      <!-- Bridge Status Indicator -->
      <div class="p-3 bg-slate-950 rounded-xl border border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2 text-xs font-mono-code">
          <span id="bridgeDot" class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
          <span id="bridgeStatusText" class="text-slate-300">Checking Termux Bridge Connection (Port 5000)...</span>
        </div>
        <button onclick="checkBridgeStatus()" class="text-xs bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded-lg text-amber-300">Ping Server</button>
      </div>

      <!-- Action Button -->
      <button id="renderBtn" onclick="triggerTermuxBridgeRender()" class="w-full bg-gradient-to-r from-red-600 via-rose-600 to-amber-600 hover:from-red-500 hover:to-amber-500 active:scale-[0.99] text-white font-black py-4 rounded-xl text-sm transition shadow-xl flex items-center justify-center gap-2">
        <i class="fa-solid fa-play text-base"></i> Trigger Local Bridge Video Compile
      </button>
    </div>

    <!-- Output Cockpit -->
    <div id="outputCockpit" class="hidden space-y-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 md:p-6 shadow-2xl space-y-4">
        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
          <div>
            <span class="text-[10px] uppercase font-bold text-emerald-400 font-mono-code">Bridge Compilation Complete ✓</span>
            <h2 id="resultMsg" class="text-base font-extrabold text-white">Video successfully compiled in Termux storage!</h2>
          </div>
          <button onclick="passToLevi()" class="text-xs bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black px-3.5 py-2 rounded-xl flex items-center gap-1.5 shadow transition">
            <i class="fa-solid fa-film"></i> Pass to Levi (Editor)
          </button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const BRIDGE_URL = "http://127.0.0.1:5000";

    async function checkBridgeStatus() {
      const dot = document.getElementById('bridgeDot');
      const text = document.getElementById('bridgeStatusText');
      try {
        const res = await fetch(`${BRIDGE_URL}/status`, { mode: 'cors' });
        if (res.ok) {
          dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
          text.innerText = "Termux Bridge Connected Successfully (Port 5000)";
        } else {
          throw new Error();
        }
      } catch (e) {
        dot.className = "w-2.5 h-2.5 rounded-full bg-rose-500";
        text.innerText = "Bridge Offline. Make sure python agent_5_app_bridge.py is running in Termux!";
      }
    }

    function autoImportScript() {
      const stored = localStorage.getItem('PIPELINE_SCRIPT_CH_02_MYSTERY');
      if (stored) {
        try {
          const d = JSON.parse(stored);
          document.getElementById('promptInput').value = d.scenes?.[0]?.visual_directive || "Cinematic mystery scene";
        } catch(e){}
      }
    }

    async function triggerTermuxBridgeRender() {
      const prompt = document.getElementById('promptInput').value.trim();
      if (!prompt) return alert("Pehle prompt likhein!");

      const btn = document.getElementById('renderBtn');
      const cockpit = document.getElementById('outputCockpit');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Triggering Termux Bridge...';
      cockpit.classList.add('hidden');

      try {
        const res = await fetch(`${BRIDGE_URL}/render-scene`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ scene_num: 1, prompt: prompt })
        });

        const data = await res.json();
        if (data.success) {
          document.getElementById('resultMsg').innerText = `Saved at: ${data.filepath}`;
          cockpit.classList.remove('hidden');
          alert("✅ Termux Bridge successfully compiled and saved the video!");
        } else {
          throw new Error(data.error || "Bridge execution failed.");
        }
      } catch (err) {
        alert("Bridge Connection Error: " + err.message + "\n\nEnsure python agent_5_app_bridge.py is running in Termux.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-play text-base"></i> Trigger Local Bridge Video Compile';
      }
    }

    window.onload = () => {
      autoImportScript();
      checkBridgeStatus();
    };
  </script>
</body>
</html>
