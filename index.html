<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Commander Erwin | YouTube AI Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
    }
    .safe-bottom {
      padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
    }
    #userInput::-webkit-scrollbar {
      width: 4px;
    }
    #userInput::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-[100dvh] font-sans select-none overflow-hidden">

  <!-- Header -->
  <header class="p-3 border-b border-slate-800 flex justify-between items-center bg-slate-900/95 backdrop-blur shadow-md flex-shrink-0 z-30">
    <div class="flex items-center gap-2">
      <button onclick="toggleSidebar()" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 transition">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <h1 class="text-sm md:text-lg font-black tracking-wide bg-gradient-to-r from-amber-400 via-yellow-200 to-amber-500 bg-clip-text text-transparent">
          COMMANDER ERWIN
        </h1>
      </div>
    </div>

    <!-- Right Controls -->
    <div class="flex items-center gap-2">
      <button onclick="setApiKey()" class="text-xs bg-slate-800 hover:bg-slate-700 px-2.5 py-1.5 rounded-lg border border-slate-700 text-slate-200">
        🔑 Key
      </button>
      <div id="authArea">
        <button id="loginBtn" onclick="promptLogin()" class="text-xs bg-blue-600 hover:bg-blue-500 text-white font-semibold px-2.5 py-1.5 rounded-lg flex items-center gap-1 shadow">
          <i class="fa-brands fa-google"></i> Login
        </button>
        <div id="userProfile" class="hidden flex items-center gap-2 bg-slate-800 px-2 py-1 rounded-xl border border-slate-700">
          <img id="userImg" src="" class="w-5 h-5 rounded-full border border-amber-400">
          <span id="userName" class="text-xs font-medium max-w-[70px] truncate hidden sm:inline"></span>
          <button onclick="logout()" title="Logout" class="text-xs text-rose-400 ml-1">
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <div class="flex-1 flex overflow-hidden relative w-full">

    <!-- Left Drawer (History & Squad Hub) -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-72 bg-slate-900 border-r border-slate-800 flex flex-col transform -translate-x-full transition-transform duration-200 ease-in-out md:relative md:translate-x-0 shadow-2xl">
      <div class="p-3 border-b border-slate-800 flex justify-between items-center gap-2">
        <button onclick="startNewChat()" class="flex-1 flex items-center justify-center gap-2 bg-amber-500 hover:bg-amber-400 active:scale-95 text-slate-950 font-bold text-xs py-2 px-3 rounded-xl shadow transition">
          <i class="fa-solid fa-plus"></i> New Strategy
        </button>
        <button onclick="toggleSidebar()" class="md:hidden p-2 text-slate-400 hover:text-white">
          <i class="fa-solid fa-xmark text-base"></i>
        </button>
      </div>

      <!-- Quick Links to Squad Members (L, Rohan & Kurapika) -->
      <div class="p-3 border-b border-slate-800/60 bg-slate-950/40">
        <span class="text-[10px] uppercase font-bold text-amber-400 tracking-wider">Active Squad Cockpits:</span>
        <div class="grid grid-cols-1 gap-1.5 mt-2">
          <div class="grid grid-cols-2 gap-1.5">
            <a href="agent_l_researcher.html" class="p-2 rounded-xl bg-slate-900 border border-slate-800 text-amber-300 hover:bg-slate-800 text-xs flex items-center gap-1.5 transition">
              🕵️ L (Researcher)
            </a>
            <a href="agent_rohan_scriptwriter.html" class="p-2 rounded-xl bg-slate-900 border border-slate-800 text-purple-300 hover:bg-slate-800 text-xs flex items-center gap-1.5 transition">
              ✍️ Rohan (Script)
            </a>
          </div>
          <!-- Kurapika Connection Button -->
          <a href="agent_kurapika_factchecker.html" class="p-2 rounded-xl bg-slate-900 border border-emerald-500/30 text-emerald-300 hover:bg-slate-800 text-xs flex items-center justify-center gap-1.5 transition font-semibold">
            🛡️ Kurapika (Fact Checker & Compliance)
          </a>
        </div>
      </div>

      <!-- Saved Chats -->
      <div class="flex-1 overflow-y-auto p-2 space-y-1" id="chatList"></div>

      <!-- Squad Status -->
      <div class="p-2.5 border-t border-slate-800 text-[11px] bg-slate-950/60">
        <span class="text-slate-400 text-[10px] uppercase font-bold">Commander's Core Squad:</span>
        <div class="flex flex-wrap gap-1 mt-1 text-[10px] text-slate-300">
          <span class="px-1.5 py-0.5 rounded bg-slate-800 text-amber-300 font-bold">L (Research ✓)</span>
          <span class="px-1.5 py-0.5 rounded bg-slate-800 text-purple-300 font-bold">Rohan (Script ✓)</span>
          <span class="px-1.5 py-0.5 rounded bg-slate-800 text-emerald-300 font-bold">Kurapika (Fact ✓)</span>
          <span class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-400">Uta</span>
          <span class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-400">Levi</span>
          <span class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-400">Senku</span>
          <span class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-400">Armin</span>
          <span class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-400">Shikamaru</span>
        </div>
      </div>

      <div class="p-2 border-t border-slate-800">
        <button onclick="clearHistory()" class="w-full text-xs text-rose-400 hover:text-rose-300 py-1.5 rounded flex items-center justify-center gap-1">
          <i class="fa-solid fa-trash"></i> Delete History
        </button>
      </div>
    </aside>

    <!-- Chat Area -->
    <main class="flex-1 flex flex-col h-full bg-slate-950 overflow-hidden relative">
      <div id="chatBox" class="flex-1 overflow-y-auto p-3 md:p-4 space-y-4"></div>

      <!-- Live Animated Thinking Tracker -->
      <div id="statusTracker" class="hidden px-4 py-2 bg-slate-900/95 border-t border-slate-800 flex items-center gap-2 text-xs text-amber-400 font-mono flex-shrink-0">
        <i class="fa-solid fa-circle-notch fa-spin text-amber-400"></i>
        <span id="statusText">Commander Erwin is coordinating with the squad...</span>
      </div>

      <!-- Media Preview -->
      <div id="mediaPreviewContainer" class="hidden px-3 py-1.5 bg-slate-900 border-t border-slate-800 flex items-center gap-2 flex-shrink-0">
        <div class="relative">
          <img id="attachedImg" class="h-12 w-12 object-cover rounded-lg border border-amber-500 shadow">
          <button onclick="removeMedia()" class="absolute -top-1.5 -right-1.5 bg-rose-600 text-white rounded-full w-4 h-4 flex items-center justify-center text-[10px]">
            &times;
          </button>
        </div>
        <span class="text-xs text-slate-300 font-mono">Attachment ready</span>
      </div>

      <!-- Bottom Chat Input Box -->
      <div class="p-2.5 md:p-3 bg-slate-900/95 border-t border-slate-800 safe-bottom flex-shrink-0 z-20">
        <div class="flex items-end gap-2 max-w-4xl mx-auto bg-slate-950 border border-slate-700/80 rounded-2xl p-1.5 focus-within:border-amber-400 transition shadow-lg">
          <label class="cursor-pointer text-slate-400 hover:text-slate-200 active:scale-95 w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0 transition mb-0.5">
            <i class="fa-solid fa-paperclip text-sm"></i>
            <input type="file" id="mediaInput" accept="image/*" class="hidden" onchange="handleMedia(event)">
          </label>

          <textarea id="userInput" rows="1" placeholder="Commander Erwin ko order dein..." oninput="autoGrow(this)" class="flex-1 bg-transparent px-2 py-2 text-sm text-slate-100 focus:outline-none resize-none max-h-36 leading-relaxed"></textarea>

          <button id="sendBtn" onclick="sendMessage()" class="bg-amber-500 hover:bg-amber-400 active:scale-95 text-slate-950 w-9 h-9 rounded-xl font-bold transition flex items-center justify-center shadow flex-shrink-0 mb-0.5">
            <i class="fa-solid fa-arrow-up text-sm"></i>
          </button>
        </div>
      </div>
    </main>
  </div>

  <script>
    let apiKey = localStorage.getItem('ERWIN_API_KEY') || localStorage.getItem('GEMINI_KEY') || '';
    let user = JSON.parse(localStorage.getItem('ERWIN_USER') || 'null');
    let sessions = [];
    let currentId = null;
    let attachedBase64 = null;
    let attachedMime = null;

    function autoGrow(element) {
      element.style.height = 'auto';
      element.style.height = (element.scrollHeight) + 'px';
      if (element.value === '') {
        element.style.height = 'auto';
      }
    }

    function getStorageKey() {
      return user ? `ERWIN_CHATS_${user.email}` : 'ERWIN_CHATS_GUEST';
    }

    function init() {
      renderAuth();
      loadSessions();
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
    }

    function renderAuth() {
      const loginBtn = document.getElementById('loginBtn');
      const profile = document.getElementById('userProfile');
      if (user) {
        loginBtn.classList.add('hidden');
        profile.classList.remove('hidden');
        document.getElementById('userName').innerText = user.name.split(' ')[0];
        document.getElementById('userImg').src = user.picture || `https://ui-avatars.com/api/?background=f59e0b&color=000&name=${encodeURIComponent(user.name)}`;
      } else {
        loginBtn.classList.remove('hidden');
        profile.classList.add('hidden');
      }
    }

    function promptLogin() {
      const email = prompt("Apna Gmail ID likhein jisse aapke chats safe aur private rahein:");
      if (email && email.includes('@')) {
        user = {
          name: email.split('@')[0],
          email: email.trim().toLowerCase(),
          picture: `https://ui-avatars.com/api/?background=f59e0b&color=000&name=${encodeURIComponent(email)}`
        };
        localStorage.setItem('ERWIN_USER', JSON.stringify(user));
        renderAuth();
        loadSessions();
        alert("Commander Erwin Studio me swagat hai, " + user.name);
      }
    }

    function logout() {
      if (confirm("Kya aap logout karna chahte hain?")) {
        localStorage.removeItem('ERWIN_USER');
        user = null;
        renderAuth();
        loadSessions();
      }
    }

    function loadSessions() {
      const key = getStorageKey();
      sessions = JSON.parse(localStorage.getItem(key) || '[]');
      if (sessions.length === 0) {
        startNewChat();
      } else {
        currentId = sessions[0].id;
        renderSidebar();
        renderChat(currentId);
      }
    }

    function saveSessions() {
      localStorage.setItem(getStorageKey(), JSON.stringify(sessions));
    }

    function startNewChat() {
      const newId = 'session_' + Date.now();
      const newSession = {
        id: newId,
        title: 'Studio Command Room',
        messages: [{
          sender: 'erwin',
          text: '🫡 Commander Erwin reporting, Sir!\n\nHamare 3 Master Specialists active hain:\n1. 🕵️ L (Researcher)\n2. ✍️ Rohan (Storyteller & Scriptwriter)\n3. 🛡️ Kurapika (Fact Checker & Compliance)\n\nHukam karein, kis topic par research, script aur fact check ka loop chalana hai?'
        }]
      };
      sessions.unshift(newSession);
      currentId = newId;
      saveSessions();
      renderSidebar();
      renderChat(newId);
    }

    function renderSidebar() {
      const box = document.getElementById('chatList');
      box.innerHTML = '';
      sessions.forEach(s => {
        const item = document.createElement('div');
        const isActive = s.id === currentId;
        item.className = `p-2 rounded-xl text-xs cursor-pointer flex justify-between items-center group transition ${isActive ? 'bg-amber-500/20 border border-amber-500/40 text-amber-300 font-semibold' : 'text-slate-300 hover:bg-slate-800'}`;
        
        const titleSpan = document.createElement('span');
        titleSpan.className = 'truncate flex-1 mr-2';
        titleSpan.innerText = s.title || 'Conversation';
        titleSpan.onclick = () => {
          renderChat(s.id);
          if (window.innerWidth < 768) toggleSidebar();
        };

        const delBtn = document.createElement('button');
        delBtn.innerHTML = '<i class="fa-solid fa-trash opacity-40 hover:opacity-100"></i>';
        delBtn.onclick = (e) => {
          e.stopPropagation();
          deleteChat(s.id);
        };

        item.appendChild(titleSpan);
        item.appendChild(delBtn);
        box.appendChild(item);
      });
    }

    function renderChat(id) {
      currentId = id;
      renderSidebar();
      const current = sessions.find(s => s.id === id);
      const box = document.getElementById('chatBox');
      box.innerHTML = '';
      if (current) {
        current.messages.forEach(m => appendUI(m.text, m.sender, m.image));
      }
    }

    function deleteChat(id) {
      sessions = sessions.filter(s => s.id !== id);
      if (sessions.length === 0) startNewChat();
      else {
        currentId = sessions[0].id;
        saveSessions();
        renderSidebar();
        renderChat(currentId);
      }
    }

    function clearHistory() {
      if (confirm("Kya aap saari chat history delete karna chahte hain?")) {
        sessions = [];
        saveSessions();
        startNewChat();
      }
    }

    function setApiKey() {
      const key = prompt("Apni Gemini API Key paste karein:", apiKey);
      if (key !== null) {
        apiKey = key.trim();
        localStorage.setItem('ERWIN_API_KEY', apiKey);
        localStorage.setItem('GEMINI_KEY', apiKey);
        alert("API Key Save Ho Gayi!");
      }
    }

    function handleMedia(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const fullBase64 = evt.target.result;
        attachedMime = file.type;
        attachedBase64 = fullBase64.split(',')[1];
        document.getElementById('attachedImg').src = fullBase64;
        document.getElementById('mediaPreviewContainer').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    function removeMedia() {
      attachedBase64 = null;
      attachedMime = null;
      document.getElementById('mediaPreviewContainer').classList.add('hidden');
      document.getElementById('mediaInput').value = '';
    }

    function setStatus(text) {
      const tracker = document.getElementById('statusTracker');
      const label = document.getElementById('statusText');
      tracker.classList.remove('hidden');
      label.innerText = text;
    }

    function hideStatus() {
      document.getElementById('statusTracker').classList.add('hidden');
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const sendBtn = document.getElementById('sendBtn');
      const text = input.value.trim();
      const media = attachedBase64;
      const mime = attachedMime;

      if (!text && !media) return;

      if (!apiKey) {
        alert("Pehle '🔑 Key' button par click karke API Key dalein!");
        return;
      }

      const active = sessions.find(s => s.id === currentId);
      if (!active) return;

      if (active.messages.filter(m => m.sender === 'user').length === 0) {
        active.title = (text || "Order").substring(0, 24);
        renderSidebar();
      }

      const userMsg = { sender: 'user', text: text || '[Sent Reference]' };
      if (media) userMsg.image = `data:${mime};base64,${media}`;

      active.messages.push(userMsg);
      appendUI(userMsg.text, 'user', userMsg.image);

      input.value = '';
      input.style.height = 'auto';
      removeMedia();
      sendBtn.disabled = true;
      sendBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-sm"></i>';

      setStatus("Commander Erwin is analyzing your directive...");
      setTimeout(() => setStatus("Consulting L (Researcher) for viral hooks..."), 700);
      setTimeout(() => setStatus("Tasking Rohan (Scriptwriter) for dual-column script..."), 1400);
      setTimeout(() => setStatus("Briefing Kurapika (Compliance) for claim audit..."), 2100);

      const erwinBrainPrompt = `You are Commander Erwin, the Executive Studio Head & Boss of an automated YouTube media company.
You report exclusively to the Owner (The User).
Active Subordinates currently operational:
1. L (YouTube Master Strategic Researcher)
2. Rohan (Master Storyteller & Scriptwriter)
3. Kurapika (Fact Checker & Compliance Officer)
Upcoming subordinates: Uta, Levi, Senku, Armin, Shikamaru.

YOUR BEHAVIOR:
- Speak directly in authoritative, sharp, respectful Hinglish/English. Address the Owner as Sir or Owner.
- When the owner gives a task:
  1. Acknowledge with military precision.
  2. State exact assignments given to L (Research), Rohan (Script & Memes), and Kurapika (Truth Check & Compliance).
  3. Deliver the full strategic battle-plan: The 0-3s retention hook, meme pacing directives, and factual guardrails!`;

      const contents = [];
      active.messages.slice(-6).forEach(m => {
        const parts = [{ text: (m.sender === 'user' ? "Owner: " : "Commander Erwin: ") + m.text }];
        if (m.sender === 'user' && m.image) {
          const partsArr = m.image.split(',');
          const mType = partsArr[0].match(/:(.*?);/)[1];
          parts.push({ inline_data: { mime_type: mType, data: partsArr[1] } });
        }
        contents.push({ role: m.sender === 'user' ? 'user' : 'model', parts: parts });
      });

      const models = ['gemini-3.8-flash', 'gemini-3.5-flash-lite'];
      let reply = null;
      let detailedErr = null;

      for (const m of models) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              system_instruction: { parts: [{ text: erwinBrainPrompt }] },
              contents: contents
            })
          });

          if (res.ok) {
            const data = await res.json();
            reply = data.candidates[0].content.parts[0].text;
            break;
          } else {
            const errData = await res.json();
            detailedErr = errData.error ? errData.error.message : `HTTP ${res.status}`;
          }
        } catch (err) {
          detailedErr = err.message;
        }
      }

      hideStatus();

      if (reply) {
        active.messages.push({ sender: 'erwin', text: reply });
        saveSessions();
        appendUI(reply, 'erwin');
      } else {
        appendUI(`Erwin: Sir, Google API server busy hai (${detailedErr || 'Network error'}). Kripya dubara try karein.`, 'erwin');
      }

      sendBtn.disabled = false;
      sendBtn.innerHTML = '<i class="fa-solid fa-arrow-up text-sm"></i>';
    }

    function appendUI(text, sender, imageUri) {
      const box = document.getElementById('chatBox');
      const div = document.createElement('div');
      div.className = sender === 'user' 
        ? "ml-auto p-3.5 rounded-2xl bg-amber-500 text-slate-950 font-medium text-sm max-w-[85%] space-y-2 shadow-lg" 
        : "p-3.5 rounded-2xl bg-slate-900 border border-slate-800 text-slate-200 text-sm max-w-[90%] space-y-2 whitespace-pre-wrap leading-relaxed shadow";

      if (imageUri) {
        const img = document.createElement('img');
        img.src = imageUri;
        img.className = "max-h-52 rounded-xl border border-black/20 object-cover";
        div.appendChild(img);
      }

      const p = document.createElement('p');
      p.innerText = text;
      div.appendChild(p);

      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    window.onload = init;
  </script>
</body>
</html>
